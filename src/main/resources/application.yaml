spring:
  application:
    name: bidders
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  mongodb:
    # Local: set MONGO_URI (see docker-compose.yml). Cluster: user/password come from the ESO-managed secret.
    uri: ${MONGO_URI:mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOSTS}/${MONGO_DATABASE_NAME:ssp-bidders}?authSource=admin}

bidders:
  migration:
    enabled: ${MIGRATION_ENABLED:true}
  catalog:
    refresh-ms: ${BIDDERS_CATALOG_REFRESH_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  # Boot 4 names (management.tracing.enabled / management.otlp.tracing.endpoint are deprecated).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    export:
      enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
